name: AHABONA Studio isolated checks

on:
  push:
    branches:
      - studio/backend-foundation-20261027
    paths:
      - 'server-v2.cjs'
      - 'server-v2-modules/studio/**'
      - 'tests/studio-store-smoke.cjs'
      - 'tests/studio-media-validation-smoke.cjs'
      - '.github/workflows/studio-isolated-checks.yml'
  pull_request:
    paths:
      - 'server-v2.cjs'
      - 'server-v2-modules/studio/**'
      - 'tests/studio-store-smoke.cjs'
      - '.github/workflows/studio-isolated-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -eu
          node --check server-v2.cjs
          node --check server-v2-modules/studio/schema.cjs
          node --check server-v2-modules/studio/store.cjs
          node --check server-v2-modules/studio/media.cjs
          node --check server-v2-modules/studio/renderer.js
          node --check server-v2-modules/studio/editor.js
          node --check tests/studio-store-smoke.cjs
          node --check tests/studio-media-validation-smoke.cjs

      - name: Test isolated Studio storage
        run: node --no-warnings tests/studio-store-smoke.cjs

      - name: Test Studio media validation guards
        run: node --no-warnings tests/studio-media-validation-smoke.cjs
