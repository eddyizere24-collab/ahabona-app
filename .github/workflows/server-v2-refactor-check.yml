name: Server v2 refactor syntax check

on:
  pull_request:
    branches: [main]
    paths:
      - 'server-v2.cjs17'
      - 'server-v2-modules/**'
      - '.github/workflows/server-v2-refactor-check.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse the refactored server and extracted JavaScript
        run: |
          set -eu
          for file in server-v2.cjs17 server-v2-modules/*.cjs server-v2-modules/assets/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
